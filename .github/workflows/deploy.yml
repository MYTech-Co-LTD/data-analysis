# .github/workflows/deploy.yml
# 生产部署：GHA 把代码 rsync 到服务器 → SSH 触发 deploy.sh（服务器 build/push）。
# 避开两个跨境瓶颈：
#   1) GHA 境外 runner push 天翼云(国内) ~30KB/s —— build/push 移到服务器（国内→国内）
#   2) 服务器(国内) git pull GitHub 偶发 TLS 中断 —— 改用 GHA rsync 推代码（同 tuangou 项目）
#
# 链路（P5 CI 演进：deploy 单 job 拆步，function 部署失败不再阻断 web 构建，CLAUDE.md 改进#5）：
# push main / PR(main) / workflow_dispatch
#   → quality job: lint(警告,依赖方向/guards 必须) + type-check(必须) + vitest(必须) + function-check(必须) + guards
#     · PR 事件只跑 quality（同时是分支保护 required check）；部署三 job 有 if 守卫，仅 push/手动跑，PR 不部署
#   → migrate job（needs quality，无 continue-on-error）: rsync(database/scripts/deploy)
#     → SSH 起后端栈 + 数据库迁移 + 刷 postgrest 缓存；失败阻断全部（数据库必须）
#   → functions job（needs migrate，continue-on-error: true）: rsync(functions/scripts/deploy)
#     → SSH 部署 edge functions + secrets；失败不阻断 build-web（function 可用 MCP 单独更新）
#     · W1 Task6：checkout 内算 CATALOG_V（catalog 内容 hash）注入 deploy-functions.sh set_secret
#   → catalog job（needs [migrate, functions]，continue-on-error: true，与 build-web 并行）:
#     scan 校验 + SSH 在 web 镜像内跑 catalog 对账（W1 Task6，红仅告警）
#   → build-web job（needs [migrate, functions]）: rsync(web/services/scripts/deploy)
#     → SSH 构建前端镜像 + 推天翼云 + compose up（web/nginx/duckdb）
#     · W1 Task6：同公式算 CATALOG_V 注入 deploy.sh → web 构建 build-arg（middleware 内联）
#
# 三个部署 job 共用同一份 scripts/deploy.sh，用 DEPLOY_PHASE=migrate|functions|web 跑对应阶段；
# 手动完整部署仍 `bash scripts/deploy.sh`（DEPLOY_PHASE 缺省 all，行为不变）。
# 旧「单 job 串联」版逻辑见本文件末尾注释块（回退备选，勿删）。
#
# Secrets：
#   SSH_HOST / SSH_USER / SSH_KEY / DEPLOY_PATH   服务器 SSH 访问
#   CTYUN_USERNAME / CTYUN_PASSWORD               服务器 docker login 天翼云（push 前端镜像用，仅 build-web 需要）
#   （NEXT_PUBLIC_INSFORGE_URL / ANON_KEY 由服务器 deploy/.env 提供，build 时注入）
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 分支保护 required check「quality」依赖 pull_request 事件跑出同名 check；
# concurrency group 用 PR number 隔离 PR 的 quality run，避免与生产部署(同 group)互相排队/取消。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-quality-{0}', github.event.pull_request.number) || 'deploy-prod' }}
  cancel-in-progress: false

jobs:
  # 质量门禁：lint(警告模式) + 依赖方向硬约束(eslint modular + guard-contract-drift,必须) + type-check/vitest/function 校验 + guards(必须)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm install

      - name: Lint (warnings allowed)
        run: cd web && npm run lint || echo "::warning::Lint has issues - check logs"
        continue-on-error: true

      - name: Type check
        run: cd web && npx tsc --noEmit

      - name: Test (vitest, 模块化后全量单测必须通过)
        run: cd web && npm test

      - name: Check edge functions
        run: bash scripts/check-functions.sh

      - name: Guard branch_num usage
        run: bash scripts/guard-branch-num.sh

      - name: Guard compute glob (no **/*.parquet)
        run: bash scripts/guard-compute-glob.sh

      # 依赖方向硬约束（spec 2026-08-11-modular-plugin-design §4.4）：jobs ⇄ boards 禁止互 import。
      # eslint 针对性规则（只启 import/no-restricted-paths，避开存量 lint error（多为 no-explicit-any））必须通过；
      # guard-contract-drift.sh 兜底 alias 形态互 import。两者任一命中即阻断。
      - name: Guard module boundaries (eslint import/no-restricted-paths, must pass)
        run: cd web && npx eslint --config eslint.modular.config.mjs lib/jobs lib/report-center/boards

      - name: Guard contract drift (jobs ⇄ boards 禁止互 import)
        run: bash scripts/guard-contract-drift.sh

      - name: Guard plugin registry (新插件必须注册)
        run: bash scripts/guard-plugin-registry.sh

      # 迁移 spec 铁律（2026-08-19 用户裁定）：含破坏性 SQL 的迁移必须关联 docs/superpowers/specs/ 文档。
      # 注意：CI checkout 无 docs 时此 guard 只检 spec 声明与文件存在——specs 随仓库全量检出，默认齐全。
      - name: Guard migration spec (破坏性迁移须关联 spec, must pass)
        run: bash scripts/guard-migration-spec.sh

  # ═══════════════ 部署拆步（P5）：migrate → functions → build-web ═══════════════
  # 数据库迁移：失败必须阻断全部（数据库先行，前端/function 依赖其 schema）。
  # if 守卫：PR 事件不部署（PR 只跑 quality 门禁），部署仅 push main / 手动触发。
  migrate:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync 代码到服务器（migrate 所需：database/scripts/deploy）
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./database ./scripts ./deploy \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: SSH 执行数据库迁移（起后端栈 + migrate + 刷 postgrest 缓存）
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            DEPLOY_PHASE=migrate bash scripts/deploy.sh

  # edge functions 部署：失败不阻断 build-web（CLAUDE.md 改进#5；function 可用 MCP 单独更新）。
  # continue-on-error: true → 即使失败，build-web 的 needs 仍视为满足而继续执行。
  functions:
    if: github.event_name != 'pull_request'
    needs: migrate
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync 代码到服务器（functions 所需：functions/scripts/deploy）
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./functions ./scripts ./deploy \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # W1 Task6 fix：本 job 不 rsync web/，服务器侧 deploy-functions.sh 只能从上一轮
      # rsync 残留的旧 catalog 树算 hash → 与 build-web 侧（新树）漂移，claims catalog_v
      # 快路径比对恒不等。改为 GHA checkout（= 本次 commit 精确内容）内计算后经 SSH 注入，
      # 与 build-web job 同公式同值（fix-round-1，DW2 跟踪#3）。
      - name: 计算 CATALOG_V（catalog 内容 hash，注入 function secrets）
        run: |
          CATALOG_V="$(cat web/lib/capability-catalog.ts web/lib/capability-catalog.generated.ts \
            | sha256sum | cut -c1-8)"
          echo "CATALOG_V=$CATALOG_V" >> "$GITHUB_ENV"
          echo "  · CATALOG_V=$CATALOG_V（catalog 内容 hash，wecom-oidc-callback claims catalog_v 基准）"

      - name: SSH 部署 edge functions + secrets
        uses: appleboy/ssh-action@v1.2.0
        env:
          CATALOG_V: ${{ env.CATALOG_V }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: CATALOG_V
          script_stop: true
          command_timeout: 30m
          script: |
            export CATALOG_V
            cd ${{ secrets.DEPLOY_PATH }}
            DEPLOY_PHASE=functions bash scripts/deploy.sh

  # W1 Task6：catalog scan 校验 + 部署后对账（容错不阻断——与 functions 同 continue-on-error 模式）。
  # 服务器无 node 二进制（deploy-functions.sh 回退先例）→ reconcile 在 web 镜像（node:22 基底，
  # 服务器本地已有）内挂仓运行；脚本纯 node 零 npm 依赖。CASDOOR_* 凭证从服务器 deploy/.env 注入
  # （不在 GHA secrets 侧复制）。对账红 = exit 1 → 仅 ::warn 告警不阻断（每日 03:47 cron 兜底观测）。
  # 与 build-web 并行（同 needs）：catalog 钩子不拖延前端部署。
  catalog:
    if: github.event_name != 'pull_request'
    needs: [migrate, functions]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # generated 与扫描一致性校验（Task 2 门禁）；漂移仅告警（容错语义），单测快跑一遍
      - name: Catalog scan 校验（generated 漂移仅告警）
        run: |
          node scripts/scan-capabilities.mjs || echo "::warn::catalog generated 漂移——运行 npm run scan:capabilities -- --write 后提交"
          node --test scripts/tests/scan-capabilities.test.mjs

      - name: 配置 SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: SSH catalog 对账（permission.resources vs catalog，红仅告警）
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            set -a; . deploy/.env; set +a
            docker run --rm \
              -e CASDOOR_API_URL="${CASDOOR_API_URL:-}" \
              -e CASDOOR_CLIENT_ID -e CASDOOR_CLIENT_SECRET \
              -e CASDOOR_ORG="${CASDOOR_ORG:-shanhai}" \
              -v "$PWD":/repo:ro -w /repo \
              registry-crs-xinan1.ctyun.cn/hookflow/data-analysis-web:latest \
              node scripts/reconcile-catalog.mjs \
              || echo '::warn::catalog 对账红/失败（不阻断；详见 /admin/capabilities 辅助页）'

  # web 构建：前端镜像 build → 推天翼云 → 起 web/nginx/duckdb。
  # needs [migrate, functions]：migrate 失败则跳过（数据库必须）；functions 有 continue-on-error 故不阻断。
  build-web:
    if: github.event_name != 'pull_request'
    needs: [migrate, functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync 代码到服务器（web 所需：web/services/scripts/deploy）
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./web ./services ./scripts ./deploy \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # W1 Task6 fix：与 functions job 同公式从 checkout 计算，注入 deploy.sh（middleware
      # 构建期内联 process.env.CATALOG_V → build-arg）——两侧同 commit 同值，fix-round-1。
      - name: 计算 CATALOG_V（catalog 内容 hash，注入 web 构建 build-arg）
        run: |
          CATALOG_V="$(cat web/lib/capability-catalog.ts web/lib/capability-catalog.generated.ts \
            | sha256sum | cut -c1-8)"
          echo "CATALOG_V=$CATALOG_V" >> "$GITHUB_ENV"
          echo "  · CATALOG_V=$CATALOG_V（catalog 内容 hash，middleware catalog_v 比对基准）"

      - name: SSH 构建前端镜像 → 推天翼云 → 起网关
        uses: appleboy/ssh-action@v1.2.0
        env:
          CTYUN_USERNAME: ${{ secrets.CTYUN_USERNAME }}
          CTYUN_PASSWORD: ${{ secrets.CTYUN_PASSWORD }}
          CATALOG_V: ${{ env.CATALOG_V }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: CTYUN_USERNAME,CTYUN_PASSWORD,CATALOG_V
          script_stop: true
          command_timeout: 30m
          script: |
            export CTYUN_USERNAME CTYUN_PASSWORD CATALOG_V
            cd ${{ secrets.DEPLOY_PATH }}
            DEPLOY_PHASE=web bash scripts/deploy.sh

  # ═══════════════ 旧 deploy 单 job（P5 拆步前的完整串联版；回退备选，勿删） ═══════════════
